name: Publish

# When a person publishes a release on GitHub (the release workflow drafts
# it), the download's copies out there are told about it, in this order:
#
# 1. The update feed: the release's appcast.xml becomes site/updates/appcast.xml
#    on main. Only now, so the feed never names a DMG that is not public yet.
# 2. The website, with that feed (site.yml).
# 3. The Homebrew cask, when HOMEBREW_TAP_TOKEN is set: a fine-grained token
#    allowed to write the contents of versaminds/homebrew-tap, nothing else.
#
# A release without a DMG (the App Store package only) changes none of them.

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed:
    name: Update feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.feed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern appcast.xml --dir "$RUNNER_TEMP/release" 2>/dev/null || true
          if [ ! -f "$RUNNER_TEMP/release/appcast.xml" ]; then
            echo "$TAG has no download, so the feed stays as it is."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' "$RUNNER_TEMP/release/appcast.xml"
          grep -q "releases/download/$TAG/Forester.dmg" "$RUNNER_TEMP/release/appcast.xml" ||
            { echo "::error::The release's appcast.xml does not offer $TAG's DMG."; exit 1; }
          cp "$RUNNER_TEMP/release/appcast.xml" site/updates/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update feed: Forester ${TAG#v}" site/updates/appcast.xml
          git push -q origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  site:
    name: Website
    needs: feed
    if: needs.feed.outputs.changed == 'true'
    uses: ./.github/workflows/site.yml
    with:
      ref: main
    secrets: inherit

  homebrew:
    name: Homebrew cask
    needs: feed
    if: needs.feed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: copy forester.rb from $TAG to Casks/forester.rb in versaminds/homebrew-tap by hand."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern forester.rb --dir "$RUNNER_TEMP"
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/versaminds/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          cp "$RUNNER_TEMP/forester.rb" Casks/forester.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/forester.rb
          git diff --cached --quiet && { echo "The cask is already at ${TAG#v}."; exit 0; }
          git commit -q -m "forester ${TAG#v}"
          git push -q origin HEAD
