name: Website

# forester.versaminds.live on Cloudflare Pages (wrangler.toml): site/ as it
# is, nothing to build. Deployed by every push to main that touches it, and by
# publish.yml once a release is in the update feed.
#
# What the repository needs, once (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit" on the
#                          account, nothing else
#   CLOUDFLARE_ACCOUNT_ID  the account id (dashboard, Workers & Pages)
# Without them it says so and deploys nothing.

on:
  push:
    branches: [main]
    paths: ['site/**', 'wrangler.toml', '.github/workflows/site.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      PROJECT: forester
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check the deployment secrets are set
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the website was not deployed (see the top of site.yml)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      # The first deploy creates the project; every later one finds it.
      - name: Make sure the Pages project exists
        if: steps.secrets.outputs.set == 'true'
        run: |
          if ! npx --yes wrangler@4.156.0 pages project list | grep -F "$PROJECT" > /dev/null; then
            npx --yes wrangler@4.156.0 pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy
        if: steps.secrets.outputs.set == 'true'
        run: |
          npx --yes wrangler@4.156.0 pages deploy --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false | tee deploy.log
          {
            echo "### Website deployed"
            echo
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- https://forester.versaminds.live/"
          } >> "$GITHUB_STEP_SUMMARY"
