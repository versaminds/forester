name: Weekly

# Every Monday morning, Forester looks after itself:
#
# - Health: every test of main, the big-directory measurements included, on
#   the newest Xcode the runners have. A failure opens an issue (or adds to
#   the open one), so a change in macOS, Xcode or the runners is seen before
#   the next release, not at it.
# - Updates: a newer Sparkle is pinned on a branch, every test runs against
#   it, and a pull request says how it went. Within the same major version
#   and with every test passing, it is merged; anything else waits for a
#   person. The workflows' own actions are kept current by Dependabot
#   (.github/dependabot.yml), whose pull requests the Tests workflow checks.
#
# The repository must let Actions open pull requests and write to it:
# Settings > Actions > General > Workflow permissions: "Read and write" and
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    name: Health of main
    uses: ./.github/workflows/ci.yml
    with:
      performance: true

  report:
    name: Report a failure
    needs: health
    if: always() && needs.health.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or add to the weekly-check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly check failed"
          body="The weekly run of every test on main failed: $RUN

          Its logs and the app's pictures are attached to the run (forester-test). The release workflow runs every test again first, so no release is made while they fail. Close this once main passes."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$title" --body "$body"
          fi

  updates:
    name: Updates
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the newest Xcode
        run: scripts/ci/select-xcode.sh

      - name: Look for a newer Sparkle
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=0
          scripts/check-updates.sh --apply || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then exit "$code"; fi

      # A pull request opened by this workflow's token starts no other
      # workflow, so the update is tested here, before it is proposed.
      - name: Test with it
        id: test
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          FORESTER_TEST_OUTPUT: ${{ runner.temp }}/forester-test
          FORESTER_STALL_LIMIT_MS: '1000'
        run: scripts/test-all.sh

      - name: Keep the logs and pictures
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forester-update-${{ github.run_id }}
          path: ${{ runner.temp }}/forester-test
          retention-days: 14
          if-no-files-found: ignore

      - name: Propose it, and merge it when it may
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          MAJOR: ${{ steps.check.outputs.major }}
          TESTED: ${{ steps.test.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="updates/sparkle-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request for Sparkle $LATEST is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Package.swift Package.resolved docs/DISTRIBUTION.md
          git commit -q -m "Sparkle $LATEST" -m "From $CURRENT: https://github.com/sparkle-project/Sparkle/releases/tag/$LATEST"
          git push -q origin "$branch"
          if [ "$TESTED" = success ]; then verdict="Every test passed with it ($RUN)."; else verdict="**Tests failed with it** ($RUN): see the run's logs before merging."; fi
          body="Sparkle $CURRENT → $LATEST, the updater in the download (the App Store variant does not contain it).
          Release notes: https://github.com/sparkle-project/Sparkle/releases/tag/$LATEST

          $verdict"
          url=$(gh pr create --base main --head "$branch" --title "Sparkle $LATEST" --body "$body")
          if [ "$TESTED" = success ] && [ "$MAJOR" != true ]; then
            gh pr merge "$url" --squash --delete-branch ||
              echo "::warning::Not merged (a branch rule may require a review); $url waits for a person."
          else
            echo "::warning::$url waits for a person: $([ "$MAJOR" = true ] && echo 'a new major version' || echo 'the tests failed')."
          fi
